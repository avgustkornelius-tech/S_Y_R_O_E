<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест темы</title>
<style>
:root {
  --bg: #0A0A0A;
  --text: #FFFFFF;
  --accent: #FF6B35;
}
[data-theme="light"] {
  --bg: #F5F2ED;
  --text: #1A1A1A;
  --accent: #E85D2A;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 20px;
  transition: background 0.5s, color 0.5s;
}
button {
  padding: 20px 40px;
  font-size: 30px;
  background: transparent;
  border: 2px solid var(--accent);
  color: var(--accent);
  cursor: pointer;
}
h1 { font-size: 40px; }
</style>
</head>
<body>

<h1>СЫРОЕ — тест темы</h1>
<button id="themeBtn"><span id="themeIcon">&#9728;</span></button>
<p>Жми кнопку. Фон должен меняться.</p>

<script>
var btn = document.getElementById('themeBtn');
var icon = document.getElementById('themeIcon');
var root = document.documentElement;

function setIcon() {
  icon.innerHTML = (root.getAttribute('data-theme') === 'light') ? '&#9790;' : '&#9728;';
}

setIcon();

btn.addEventListener('click', function() {
  var t = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', t);
  setIcon();
});
</script>

</body>
</html>
